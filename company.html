<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Exam Pattern & Questions | PrepPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html">
      <span class="brand-mark">P</span>
      <span>PrepPilot</span>
    </a>
    <div class="navlinks">
      <a href="dashboard.html">Dashboard</a>
      <a href="companies.html" style="color:var(--purple);">Company Prep</a>
      <a href="practice.html">Practice Mode</a>
      <a href="cheatsheets.html">Cheatsheets</a>
      <a href="results.html">My Results</a>
      <a href="tools.html">Study Tools</a>
      <a href="leaderboard.html">Leaderboard</a>
      <span class="nav-user">Student</span>
      <a class="nav-cta" href="dashboard.html">Dashboard</a>
    </div>
  </nav>

  <main class="container" id="company-main-container">
    <div id="company-content">
      <!-- Injected via script based on URL parameter ?id=... -->
    </div>
  </main>

  <footer>
    <div class="footer-wrap">
      <div><strong>PrepPilot</strong> · Campus Recruitment Exam Practice Platform</div>
      <div>© 2026 PrepPilot · Built for placement excellence and interview readiness.</div>
    </div>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cid = (urlParams.get("id") || "tcs").toLowerCase();
      const comp = COMPANIES.find(c => c.id.toLowerCase() === cid || c.short_name.toLowerCase() === cid) || COMPANIES[0];

      document.title = `${comp.name} Exam Pattern & Questions | PrepPilot`;

      // Filter sample questions
      const compQuestions = QUESTIONS.filter(q => 
        q.company.toLowerCase().includes(comp.short_name.toLowerCase()) || q.company === "All"
      ).slice(0, 6);

      const content = document.getElementById("company-content");
      content.innerHTML = `
        <div class="company-detail-header">
          <div class="company-header-main">
            <div class="company-monogram-hero" style="background: ${comp.color};">
              ${comp.short_name}
            </div>
            <div>
              <div class="eyebrow">COMPANY RECRUITMENT BLUEPRINT</div>
              <h1>${comp.name}</h1>
              <p class="lead">${comp.tagline}</p>
            </div>
          </div>
          <div class="company-header-actions">
            <div class="ctc-box">
              <small>PACKAGE / CTC</small>
              <strong>${comp.ctc_range}</strong>
            </div>
            <a href="quiz.html?company=${comp.id}" class="btn primary">
              Take ${comp.short_name} Mock Exam <span>→</span>
            </a>
          </div>
        </div>

        <!-- ELIGIBILITY & OVERVIEW BANNER -->
        <section class="detail-overview-card">
          <div class="overview-grid">
            <div>
              <div class="eyebrow">ABOUT THE RECRUITMENT PROCESS</div>
              <p>${comp.overview}</p>
            </div>
            <div class="eligibility-box">
              <div class="eyebrow">ELIGIBILITY CRITERIA</div>
              <p><strong>${comp.eligibility}</strong></p>
            </div>
          </div>
        </section>

        <!-- SELECTION PROCESS ROUNDS -->
        <div class="section-heading">
          <div>
            <div class="eyebrow">STEP-BY-STEP HIRING PROCESS</div>
            <h2>Selection Rounds & Formats</h2>
          </div>
        </div>

        <div class="rounds-timeline">
          ${comp.rounds.map(r => `
            <div class="round-card">
              <div class="round-number">${r.round_num}</div>
              <div class="round-content">
                <div class="round-top">
                  <h3>${r.name}</h3>
                  <span class="round-time">⏱ ${r.duration}</span>
                </div>
                <p class="round-format"><strong>Format:</strong> ${r.format}</p>
                <p class="round-rules"><strong>Evaluation / Marking:</strong> ${r.negative_marking}</p>
              </div>
            </div>
          `).join("")}
        </div>

        <!-- WHICH TYPE OF QUESTIONS DOES THIS COMPANY ASK? -->
        <div class="section-heading">
          <div>
            <div class="eyebrow">SYLLABUS & QUESTION CLASSIFICATION</div>
            <h2>Which Type of Questions Does ${comp.short_name} Ask?</h2>
          </div>
        </div>

        <div class="question-type-grid">
          ${comp.question_types.map(qt => `
            <article class="qtype-card">
              <div class="qtype-header">
                <span class="qtype-badge">${qt.weightage} Weightage</span>
                <span class="difficulty-chip ${qt.difficulty.toLowerCase().split(' ')[0]}">${qt.difficulty}</span>
              </div>
              <h3>${qt.category}</h3>
              <div class="qtype-row">
                <strong>Core Focus Topics:</strong>
                <p>${qt.focus_topics}</p>
              </div>
              <div class="qtype-row">
                <strong>Question Pattern & Characteristics:</strong>
                <p class="pattern-text">${qt.sample_patterns}</p>
              </div>
            </article>
          `).join("")}
        </div>

        <!-- COMPANY CRACKING TIPS -->
        <div class="section-heading">
          <div>
            <div class="eyebrow">PLACEMENT STRATEGY</div>
            <h2>Expert Tips to Clear ${comp.short_name}</h2>
          </div>
        </div>

        <div class="tips-card">
          <ul class="tips-list">
            ${comp.tips.map(tip => `
              <li>
                <span class="tip-check">✓</span>
                <div>${tip}</div>
              </li>
            `).join("")}
          </ul>
        </div>

        <!-- SAMPLE QUESTIONS -->
        ${compQuestions.length > 0 ? `
          <div class="section-heading">
            <div>
              <div class="eyebrow">SAMPLE PRACTICE QUESTIONS</div>
              <h2>Questions Asked in ${comp.short_name} Rounds</h2>
            </div>
            <a class="text-link" href="practice.html?company=${encodeURIComponent(comp.short_name)}">Practice all ${comp.short_name} questions →</a>
          </div>

          <div class="sample-q-list">
            ${compQuestions.map(sq => `
              <div class="sample-q-item">
                <div class="sample-q-meta">
                  <span class="category-meta">${sq.category} · ${sq.topic}</span>
                  <span class="difficulty-chip ${sq.difficulty.toLowerCase()}">${sq.difficulty}</span>
                </div>
                <h4>${sq.question}</h4>
                <div class="sample-q-answer">
                  <strong>Correct Answer: Option ${sq.answer}</strong>
                  <p class="muted">${sq.explanation}</p>
                </div>
              </div>
            `).join("")}
          </div>
        ` : ''}

        <div class="cta-banner">
          <div>
            <h3>Ready to test your skills for ${comp.name}?</h3>
            <p>Simulate the exact time limit, question distribution, and pressure of the actual placement test.</p>
          </div>
          <a href="quiz.html?company=${comp.id}" class="btn primary">
            Start ${comp.short_name} Mock Exam Now <span>→</span>
          </a>
        </div>

        <a class="btn secondary back-btn" href="companies.html">← Back to Company Hub</a>
      `;
    });
  </script>
</body>
</html>
